name: Main application checks
on:
  push:
    branches: [main, 'codex/public-main-readiness']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  clean-install:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install local model runtime without downloading weights
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Install complete application and build UI
        run: ./start.sh --check
      - name: Synthetic regression suite
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Verify public source tree
        run: .venv/bin/python scripts/check_public_tree.py
